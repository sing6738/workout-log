name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npm run gen:types
      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/types/database.ts
      # The committed src/types/database.ts is still a placeholder, so the step below
      # will fail on the first run; that is expected and the real file will be committed from the artifact.
      - run: git diff --exit-code src/types/database.ts
